<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Membership.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="site.css">
        <title>Membership Registration Page</title>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-xl custom-nav bg-black">
                <div class="container-fluid">
                  <!-- Navbar brand (logo) -->
                  <a href="index.html" class="navbar-brand">
                    <img src="/images/onlywayoutloho.PNG" alt="only way out logo" class="logo" />
                  </a>
          
                  <!-- Hamburger toggle button -->
                  <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarBasic"
                    aria-controls="navbarBasic"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                  >
                    <span class="navbar-toggler-icon"></span>
                  </button>
          
                  <!-- Collapsible nav links -->
                  <div class="collapse navbar-collapse" id="navbarBasic">
                    <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                      <li class="nav-item"><a class="nav-link" href="Albums.html">Albums</a></li>
                      <li class="nav-item"><a class="nav-link" href="Videos.html">Videos</a></li>
                      <li class="nav-item"><a class="nav-link" href="MembershipRegistration.html">Membership Registration</a></li>
                      <li class="nav-item"><a class="nav-link" href="Information.html">Information Page</a></li>
                      <li class="nav-item"><a class="nav-link" href="TheTrap.html">TrapHouse</a></li>
                      <li class="nav-item"><a class="nav-link" href="index.html#tour-dates">Tour Dates</a></li>
                    </ul>
                  </div>
                </div>
              </nav>
            </header>
            <main>
            <h1 class="First-Header">Member Registration</h1>
            <fieldset class="form-container">
                <form id="registrationForm" novalidate>
                    <label class="label-comment" for="name">Full Name:</label>
                    <input class="form-control" type="text" id="name" name="name" placeholder="Enter Name" aria-label="Full name" required>
                    
                    <label class="label-comment" for="email">Email:</label>
                    <input class="form-control" type="email" id="email" name="email" placeholder="Enter Email" aria-label="Email address" required>
                    
                    <label class="label-comment" for="password">Password:</label>
                    <input class="form-control" type="password" id="password" name="password" minlength="7" maxlength="18" placeholder="Enter Password" aria-label="Password" required>
                    
                    <div id="registrationStatus" class="status-message" aria-live="polite"></div>
                    <div>
                        <button class="bttn" type="reset">Reset</button>
                        <button class="bttn" id="submitButton" type="submit">Submit</button>
                        <button class="bttn" type="button" onclick="window.location.href='login.html'">Already Have An Account</button>
                    </div>
                </form>
            </fieldset>
            </main>
        
        <script src="firebase-config.js"></script>
        <script src="auth-helpers.js"></script>

        <!-- Firebase SDKs -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
            import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
            import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

            const firebaseConfig = window.firebaseConfig;
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const registrationForm = document.getElementById('registrationForm');
            const registrationStatus = document.getElementById('registrationStatus');
            const submitButton = document.getElementById('submitButton');

            registrationForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!name || !email || !password) {
                    window.OnlyWayOutAuth.setStatus(registrationStatus, 'Please fill in all fields.', 'error');
                    return;
                }

                if (!window.OnlyWayOutAuth.validateEmail(email)) {
                    window.OnlyWayOutAuth.setStatus(registrationStatus, 'Please enter a valid email address.', 'error');
                    return;
                }

                if (password.length < 7 || password.length > 18) {
                    window.OnlyWayOutAuth.setStatus(registrationStatus, 'Password must be between 7 and 18 characters.', 'error');
                    return;
                }

                window.OnlyWayOutAuth.setLoading(submitButton, true, 'Creating account...');
                window.OnlyWayOutAuth.setStatus(registrationStatus, 'Creating your account...', 'info');

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, 'members', user.uid), {
                        name,
                        email,
                        createdAt: new Date()
                    });

                    registrationForm.reset();
                    window.OnlyWayOutAuth.setStatus(registrationStatus, 'Registration successful! Redirecting to login...', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } catch (error) {
                    window.OnlyWayOutAuth.setStatus(registrationStatus, error.message || 'Registration failed. Please try again.', 'error');
                    console.error('Error creating user:', error);
                } finally {
                    window.OnlyWayOutAuth.setLoading(submitButton, false);
                }
            });
        </script>
        <!-- Bootstrap JS Bundle (includes Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
