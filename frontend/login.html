<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="Login.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-xl custom-nav bg-black">
      <div class="container-fluid">
        <!-- Navbar brand (logo) -->
        <a href="index.html" class="navbar-brand">
          <img src="/images/onlywayoutloho.PNG" alt="only way out logo" class="logo" />
        </a>

        <!-- Hamburger toggle button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarBasic"
          aria-controls="navbarBasic"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible nav links -->
        <div class="collapse navbar-collapse" id="navbarBasic">
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            <li class="nav-item"><a class="nav-link" href="Albums.html">Albums</a></li>
            <li class="nav-item"><a class="nav-link" href="Videos.html">Videos</a></li>
            <li class="nav-item"><a class="nav-link" href="MembershipRegistration.html">Membership Registration</a></li>
            <li class="nav-item"><a class="nav-link" href="Information.html">Information Page</a></li>
            <li class="nav-item"><a class="nav-link" href="TheTrap.html">TrapHouse</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#tour-dates">Tour Dates</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="container mt-5 text-white">
    <h2>Member Login</h2>
    <form id="loginForm" novalidate>
      <label for="email">Email:</label>
      <input class="form-control" type="email" id="email" required />
      
      <label for="password" class="mt-2">Password:</label>
      <input class="form-control" type="password" id="password" required />
      
      <button class="btn btn-success mt-3" id="loginButton" type="submit">Login</button>
    </form>
    <div id="loginStatus" class="status-message mt-3" aria-live="polite"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-helpers.js"></script>

  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = window.firebaseConfig;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const statusDiv = document.getElementById('loginStatus');
    const loginButton = document.getElementById('loginButton');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        window.OnlyWayOutAuth.setStatus(statusDiv, 'Please enter both email and password.', 'error');
        return;
      }

      if (!window.OnlyWayOutAuth.validateEmail(email)) {
        window.OnlyWayOutAuth.setStatus(statusDiv, 'Please enter a valid email address.', 'error');
        return;
      }

      window.OnlyWayOutAuth.setLoading(loginButton, true, 'Signing in...');
      window.OnlyWayOutAuth.setStatus(statusDiv, 'Signing in...', 'info');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.OnlyWayOutAuth.setStatus(statusDiv, 'Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } catch (error) {
        window.OnlyWayOutAuth.setStatus(statusDiv, error.message || 'Unable to sign in. Please try again.', 'error');
      } finally {
        window.OnlyWayOutAuth.setLoading(loginButton, false);
      }
    });
  </script>
</body>
</html>
