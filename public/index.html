<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="1; url=../frontend/index.html" />
    <title>Only Way Out | Redirecting</title>
    <style>
      :root {
        --bg: #050505;
        --panel: #111111;
        --text: #f5f5f5;
        --muted: #b8b8b8;
        --accent: #13a34a;
        --accent-strong: #0d7d39;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a1a1a, var(--bg));
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(90vw, 540px);
        padding: 2rem;
        background: rgba(17,17,17,0.95);
        border: 1px solid rgba(19,163,74,0.4);
        border-radius: 16px;
        box-shadow: 0 16px 36px rgba(0,0,0,0.4);
        text-align: center;
      }
      img {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid rgba(19,163,74,0.8);
      }
      h1 { margin: 1rem 0 0.5rem; font-size: clamp(1.7rem, 3vw, 2.8rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--text);
        background: var(--accent);
        padding: 0.9rem 1.25rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { background: var(--accent-strong); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../frontend/images/onlywayoutloho.PNG" alt="Only Way Out logo" />
      <h1>Only Way Out</h1>
      <p>Redirecting to the live site...</p>
      <a href="../frontend/index.html">Go now</a>
    </div>
  </body>
</html>
